<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><title>のび太の作業効率UPUP大作戦</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header{height:52px;display:flex;align-items:center;justify-content:center;padding:0 12px;font-weight:700;font-size:14px;text-align:center}main{min-height:calc(100dvh - 126px);display:flex;justify-content:center;align-items:center;padding:6px 12px}.page{display:block;max-width:100%;max-height:calc(100dvh - 145px);width:auto;height:auto;object-fit:contain;box-shadow:0 5px 25px #0008;user-select:none;-webkit-user-drag:none}footer{position:sticky;bottom:0;background:#101827eF;padding:10px max(12px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:18px}button{border:1px solid #64748b;background:#24344d;color:white;border-radius:12px;min-height:44px;padding:0 20px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:default}#counter{min-width:74px;text-align:center;font-variant-numeric:tabular-nums}p{margin:0;text-align:center;font-size:12px;color:#aab7c9}@media(min-width:850px){.page{max-height:calc(100dvh - 145px)}}
</style></head><body><header>のび太の作業効率UPUP大作戦</header><main id="reader"><img id="page" class="page" src="01.png" alt="漫画 表紙" draggable="false"></main><p>左右スワイプ・矢印キーでもページを移動できます</p><footer><button id="prev" type="button">← 戻る</button><span id="counter" aria-live="polite">1 / 10</span><button id="next" type="button">次へ →</button></footer><script>
const pages=Array.from({length:10},(_,i)=>String(i+1).padStart(2,'0')+'.png');let index=0;const img=document.getElementById('page'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');function show(n){index=Math.max(0,Math.min(pages.length-1,n));img.src=pages[index];img.alt=index===0?'漫画 表紙':'漫画 '+index+'ページ';counter.textContent=(index+1)+' / '+pages.length;prev.disabled=index===0;next.disabled=index===pages.length-1;history.replaceState(null,'','#page-'+(index+1));}prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(index+1);if(e.key==='ArrowLeft')show(index-1)});let x=0,y=0;const reader=document.getElementById('reader');reader.addEventListener('touchstart',e=>{x=e.changedTouches[0].screenX;y=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-x,dy=e.changedTouches[0].screenY-y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)show(index+(dx<0?1:-1))},{passive:true});const match=location.hash.match(/^#page-(\d+)$/);show(match?Number(match[1])-1:0);
</script></body></html>
